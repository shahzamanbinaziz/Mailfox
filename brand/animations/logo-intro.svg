<g class="body"><rect x="6" y="18" width="52" height="38" rx="8" fill="#FF6A1A"/><rect x="8.5" y="20.5" width="47" height="33" rx="5.8" fill="#FFF3E8"/></g>
<g clip-path="url(#b)"><path class="flap" d="M6 18 L58 18 L58 22 L32 46 L6 22 Z" fill="#FF6A1A"/></g>
<g class="face" fill="#0F1729"><ellipse cx="22" cy="30" rx="2.6" ry="3.1"/><ellipse cx="42" cy="30" rx="2.6" ry="3.1"/><path d="M28.4 43.2 L35.6 43.2 Q36.9 43.2 36.1 44.3 L33 48.3 Q32 49.4 31 48.3 L27.9 44.3 Q27.1 43.2 28.4 43.2 Z"/></g>
</svg>
