# Mailfox — local development stack.
#   docker compose up        → http://localhost:3000 (app), :8025 (Mailpit inbox), :3001 (tracker)
#
# Values below are DEV-ONLY defaults so the stack starts with zero setup. Any value in a `.env`
# file next to this one overrides them. Never deploy these defaults — production uses
# infra/docker-compose.prod.yml (Phase 9), which refuses to start without real secrets.

x-app-env: &app-env
  NODE_ENV: production
  APP_URL: ${APP_URL:-http://localhost:3000}
  TRACKING_URL: ${TRACKING_URL:-http://localhost:3001}
  DATABASE_URL: postgresql://${POSTGRES_USER:-mailfox}:${POSTGRES_PASSWORD:-mailfox}@postgres:5432/${POSTGRES_DB:-mailfox}
  REDIS_URL: redis://redis:6379
  # DEV-ONLY key (base64 of 32 bytes). Override in .env for anything real.
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-ZGV2LW9ubHktbWFpbGZveC1rZXktMzItYnl0ZXMhISE=}
  AUTH_SECRET: ${AUTH_SECRET:-dev-only-auth-secret-change-me-please}
  TRACKING_SIGNING_SECRET: ${TRACKING_SIGNING_SECRET:-dev-only-tracking-secret-change-me}
  SEND_MODE: ${SEND_MODE:-dev}
  MAILPIT_SMTP_HOST: mailpit
  MAILPIT_SMTP_PORT: "1025"
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@mailfox.local}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-mailfox-admin-123}
  SEED_COMPANY_ADDRESS: ${SEED_COMPANY_ADDRESS:-Mailfox HQ, 1 Fox Lane, Lahore, Pakistan}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mailfox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mailfox}
      POSTGRES_DB: ${POSTGRES_DB:-mailfox}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025" # web inbox
      - "1025:1025" # SMTP
    environment:
      MP_MAX_MESSAGES: 20000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  migrate:
    build: { context: ., target: migrate }
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    environment: *app-env
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  tracker:
    build: { context: ., target: tracker }
    restart: unless-stopped
    environment: *app-env
    ports: ["3001:3001"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
